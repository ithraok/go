<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فهرس الروابط</title>
<style>
  :root{--bg:#f5f7f1;--panel:#fff;--line:#dce5d2;--ink:#172113;--muted:#5f6d56;--accent:#4f7f00;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7;padding:28px}
  main{max-width:920px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:0 22px 50px -34px rgba(45,58,35,.38)}
  h1{margin:0 0 6px;font-size:24px}
  p{margin:0 0 18px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;overflow:hidden;border:1px solid var(--line);border-radius:8px}
  th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
  th{background:#eef7d8;color:var(--ink);font-size:13px}
  tr:last-child td{border-bottom:none}
  .num{width:70px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
  .slug{direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
  a{color:var(--accent);font-weight:700;text-decoration:none}
  a:hover{text-decoration:underline}
  @media(max-width:620px){body{padding:14px}main{padding:16px}th,td{padding:10px}.num{width:48px}}
</style>
</head>
<body>
<main>
  <h1>فهرس الروابط</h1>
  <p>روابط الاختصار المنشورة في هذا المستودع.</p>
  <table>
    <thead><tr><th>م</th><th>الاختصار</th><th>التعريف</th></tr></thead>
    <tbody>
    <tr>
      <td class="num">1</td>
      <td class="slug"><a href="3/">/3</a></td>
      <td>الصف الثالث</td>
    </tr>
    <tr>
      <td class="num">2</td>
      <td class="slug"><a href="2/">/2</a></td>
      <td>الصف الثاني</td>
    </tr>
    <tr>
      <td class="num">3</td>
      <td class="slug"><a href="1/">/1</a></td>
      <td>الصف الأول</td>
    </tr></tbody>
  </table>
</main>
</body>
</html>
